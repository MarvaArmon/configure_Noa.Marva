# Publishes the site to GitHub Pages. The Firebase key lives in the repo secret FIREBASE_API_KEY
# and is put into the studio only in the published copy, never in the repo.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the Firebase key into the studio
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then echo "::error::Add the FIREBASE_API_KEY secret under Settings > Secrets and variables > Actions"; exit 1; fi
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|" studio/layout-studio.html
          if grep -q "__FIREBASE_API_KEY__" studio/layout-studio.html; then echo "::error::The key placeholder was not replaced"; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
